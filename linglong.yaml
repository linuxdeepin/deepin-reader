version: "1"

package:
  id: org.deepin.reader
  name: "deepin-reader"
  version: 6.5.69.1
  kind: app
  description: |
    reader for deepin os.

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.webengine/6.7.0

command:
  - deepin-reader

build: |
  # 设置INCLUDEPATH为引入的CFLAGS环境变量获取的路径
  sed -i '33i INCLUDEPATH += $$INCPATHS' 3rdparty/deepin-pdfium/src/src.pro
  sed -i '35i INCLUDEPATH += $$INCPATHS' htmltopdf/htmltopdf.pro
  sed -i '2i INCLUDEPATH += $$INCPATHS' reader/reader.pro
  sed -i 's|/usr/lib/qt6/bin/lrelease|lrelease|g' translate_generation.sh

  # 构建
  VERSION=$(head -1 debian/changelog | awk -F'[()]' '{print $2}')
  # 清掉随源码带入的构建残留（如本机 CMake 产物）：残留的 Makefile 会让
  # qmake 子目录规则 test -e Makefile 短路跳过 qmake，误走 CMake 构建
  rm -rf build && mkdir -p  build && cd build
  qmake -set APP_INSTALL_LIBS ${PREFIX}/lib/${TRIPLET}
  # pkg-config 输出的是裸 -lQt6Gui，没有 -L/runtime，链接会命中 /usr 的旧
  # Qt6Gui；runtime 的 libQt6WaylandClient 需要新 Qt 私有符号，必须显式把
  # runtime 库目录放到链接搜索路径最前。
  qmake "VERSION=${VERSION}" \
    "PREFIX=${PREFIX}" \
    "LINGLONG_BUILD_ON=1" \
    "CONFIG+=xps_support" \
    "QMAKE_LFLAGS+=-L/runtime/lib/${TRIPLET}" \
    "INCPATHS=$(echo "$CFLAGS" | sed 's/-I//g')" \
    "LIB_INSTALL_DIR=${PREFIX}/lib/${TRIPLET}" \
    "INSTALL_ROOT=${PREFIX}" \
    ../deepin_reader.pro
  make -j`nproc`
  make install
  cd ..

  # buildext 依赖只把 pandoc 可执行文件收进层，share 数据（docx 转换必需的
  # abbreviations 等）不会进层；pandoc 找不到数据文件会 exit 97 导致 DOCX
  # 打开失败。手动将数据收进应用目录，与代码 INSTALL_PREFIX/share/pandoc/data 对齐。
  # 注意：CI 的 buildext 只在构建环境安装 build_depends（depends 的 pandoc
  # 由收层阶段处理），因此 pandoc 必须同时声明在 build_depends，否则此处
  # cp 因 /usr/share/pandoc/data 不存在而失败
  mkdir -p "${PREFIX}/share/pandoc"
  cp -a /usr/share/pandoc/data "${PREFIX}/share/pandoc/"

# allow apt download in build and do apt update
buildext:
  apt:
    build_depends:
      - pandoc
      - libdjvulibre-dev
      - libicu-dev
      - liblcms2-dev
      - libopenjp2-7-dev
      - libchardet-dev
      - libkf6globalaccel-dev
      - libkf6i18n-dev
      - libgxps-dev
      - libcairo2-dev
      - libglib2.0-dev
      - libfreetype6-dev
    depends:
      - pandoc
      - libdjvulibre21
      - libchardet1
      - libkf6globalaccel6
      - libkf6i18n6
      - libgxps2
