    key: ctrl++
  - action: keyboard_hot_key
    key: ctrl+-
  - action: keyboard_hot_key
    key: ctrl+r
  - action: keyboard_hot_key
    key: ctrl+shift+r
  - action: keyboard_press
    key: PageUp
  - action: keyboard_press
    key: PageDown
  - action: keyboard_press
    key: Up
  - action: keyboard_press
    key: Down
  - action: assert_element
    selector:
      name: Button_thumbnail
      role: check box
    do: assert_exists
  - action: assert_element
    selector:
      name: DLineEditChildLineEdit
      role: text
    do: assert_exists
  - action: assert_element
    selector:
