    - DLineEditChildLineEdit
    - Button_thumbnail
  steps:
  - action: keyboard_hot_key
    key: ctrl+m
  - action: keyboard_hot_key
    key: ctrl+1
  - action: keyboard_hot_key
    key: ctrl+2
  - action: keyboard_hot_key
    key: ctrl+3
