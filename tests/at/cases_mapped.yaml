metadata:
  generated_at: "2026-08-19T14:35:00"
  source: "文档查看器V25-用例.xlsx"
cases:
  # ==========================================================
  # Suite: doc_open_1 - 文档打开-基础操作
  # ==========================================================
  - id: suite_doc_open_1
    name: "文档打开-基础操作"
    module: doc_open
    status: active
    annotation:
      测试界面: "主窗口-文件打开界面"
      测试功能: "文档打开功能（多种格式/拖拽/快捷键打开）"
      前置条件: "应用已启动"
      AT元素引用: ["PagingWidget"]
    setup:
      - action: session_start
        command: "deepin-reader"
    steps:
      - step_type: action
        description: "打开文档，查看右侧和底部进度条"
        action: keyboard_hot_key
        key: ctrl+o
      - step_type: action
        description: "选择测试文档打开"
        action: keyboard_type
        text: "/home/test/test.pdf"
      - step_type: action
        description: "确认打开"
        action: keyboard_press
        key: enter
      - step_type: assert
        description: "文档已打开，进度条显示正常"
        action: assert_element
        selector:
          name: PagingWidget
        do: assert_exists
      - step_type: action
        description: "重命名操作测试"
        action: keyboard_press
        key: tab
      - step_type: action
        description: "按Enter键确认"
        action: keyboard_press
        key: enter
      - step_type: action
        description: "按空格键"
        action: keyboard_press
        key: space
    teardown:
      - action: session_stop

  # ==========================================================
  # Suite: doc_open_2 - 文档打开-保存退出
  # ==========================================================
  - id: suite_doc_open_2
    name: "文档打开-保存退出"
    module: doc_open
    status: active
    annotation:
      测试界面: "主窗口-文件操作"
      测试功能: "文档保存/另存/退出提示"
      前置条件: "文档已打开"
      AT元素引用: ["PagingWidget"]
    setup:
      - action: session_start
        command: "deepin-reader /home/test/test.pdf"
    steps:
      - step_type: action
        description: "打开多个标签页"
        action: dtk_main_menu
        items: ["新标签页"]
      - step_type: action
        description: "按Ctrl+S保存"
        action: keyboard_hot_key
        key: ctrl+s
      - step_type: assert
        description: "文档保存成功"
        action: assert_element
        selector:
          name: PagingWidget
        do: assert_exists
      - step_type: action
        description: "按Ctrl+Shift+S另存"
        action: keyboard_hot_key
        key: ctrl+shift+s
    teardown:
      - action: session_stop

  # ==========================================================
  # Suite: doc_ops_1 - 文档视图-页面操作
  # ==========================================================
  - id: suite_doc_ops_1
    name: "文档视图-页面操作(1)"
    module: doc_ops
    status: active
    annotation:
      测试界面: "主窗口-文档视图区域"
      测试功能: "页面导航与缩放操作"
      前置条件: "文档已打开"
      AT元素引用: ["PagingWidget", "Edit_Page", "Edit_Page_P", "thumbnailNextBtn", "thumbnailPreBtn"]
    setup:
      - action: session_start
        command: "deepin-reader /home/test/test.pdf"
    steps:
      - step_type: action
        description: "输入页码"
        action: element_action
        selector:
          name: Edit_Page
          role: panel
        do: click
      - step_type: action
        description: "输入页码数值"
        action: keyboard_type
        text: "3"
      - step_type: action
        description: "确认跳转"
        action: keyboard_press
        key: enter
      - step_type: assert
        description: "页面跳转成功"
        action: assert_element
        selector:
          name: Edit_Page
        do: assert_exists
      - step_type: action
        description: "翻到下一页"
        action: element_action
        selector:
          name: thumbnailNextBtn
          role: panel
        do: click
      - step_type: action
        description: "翻到上一页"
        action: element_action
        selector:
          name: thumbnailPreBtn
          role: panel
        do: click
      - step_type: action
        description: "Ctrl+滚轮放大"
        action: keyboard_hot_key
        key: ctrl+equal
      - step_type: action
        description: "Ctrl+滚轮缩小"
        action: keyboard_hot_key
        key: ctrl+minus
    teardown:
      - action: session_stop

