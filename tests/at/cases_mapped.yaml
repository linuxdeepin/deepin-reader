# === 格式范例 ===
# 此文件由 pipeline_assemble.py 从 modules/*.output.json 组装生成，格式如下:
# cases:
#   - id: suite_<模块>_<序号>_s1
#     name: suite名称
#     module: 模块名
#     annotation:
#       测试界面: ...
#       测试功能: ...
#       前置条件: ...
#       AT元素引用: [真实元素名]
#     steps:
#       - step_type: action
#         action: session_start
#         command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
version: '1.0'
cases:
- id: suite_主菜单_001_s1
  name: 主菜单-新标签页
  module: 主菜单
  annotation:
    测试界面: 主菜单 + 标签栏（Form_DocTabBar）
    测试功能: 主菜单→新标签页，在已打开文档的基础上新增一个标签页
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{DTitlebarMainMenu 新标签页}'
    - '{DTabBarAddButton}'
    - '{Form_DocSheet}'
  steps:
  - action: dtk_main_menu
    items:
    - 新标签页
  - action: assert_element
    selector:
      name: DTabBarAddButton
      role: button
- id: suite_主菜单_002_s1
  name: 主菜单-新窗口（多窗口）
  module: 主菜单
  annotation:
    测试界面: 主菜单 + 第二窗口（Form_DMainWindow_1）
    测试功能: 主菜单→新窗口，打开新的文档查看器窗口并可重复打开，原窗口与文档保持开启
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{DTitlebarMainMenu 新窗口}'
    - '{Form_DMainWindow_1}'
    - '{Form_DMainWindow}'
  steps:
  - action: dtk_main_menu
    items:
    - 新窗口
  - action: dtk_main_menu
    items:
    - 新窗口
  - action: assert_element
    selector:
      name: Form_DMainWindow_1
      role: form
- id: suite_主菜单_003_s1
  name: 主菜单-保存与多次保存
  module: 主菜单
  annotation:
    测试界面: 主菜单（保存/Ctrl+S）+ 文档区（Form_DocSheet）
    测试功能: 对当前文档 Ctrl+S 保存，并支持多次保存不报错（保存当前修改并保持文档界面）
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{DTitlebarMainMenu 保存}'
    - '{Form_DocSheet}'
  steps:
  - action: keyboard_hot_key
    key: ctrl+s
  - action: keyboard_hot_key
    key: ctrl+s
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
- id: suite_主菜单_004_s1
  name: 主菜单-另存为
  module: 主菜单
  annotation:
    测试界面: 主菜单（另存为/Ctrl+Shift+S）+ 系统文件对话框
    测试功能: 打开另存为（Ctrl+Shift+S）弹出文件保存对话框，选择路径保存为新文件
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{DTitlebarMainMenu 另存为}'
    - '{Form_DMainWindow}'
    - '{Form_CentralDocPage}'
  steps:
  - action: keyboard_hot_key
    key: ctrl+shift+s
    wait: 1.0
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/save_copy_test.pdf
    wait: 3.0
  - action: assert_element
    selector:
      name: Form_CentralDocPage
      role: form
- id: suite_主菜单_005_s1
  name: 主菜单-主题切换（深色/浅色/跟随系统）
  module: 主菜单
  annotation:
    测试界面: 主菜单-主题子菜单（DTitlebarThemeMenu）
    测试功能: 主菜单→主题→深色/浅色/跟随系统，切换窗口主题并保持界面正常
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{DTitlebarMainMenu 主题}'
    - '{DTitlebarThemeMenu 深色}'
    - '{DTitlebarThemeMenu 浅色}'
    - '{DTitlebarThemeMenu 跟随系统}'
    - '{Form_DMainWindow}'
  steps:
  - action: dtk_main_menu
    items:
    - 主题
    - 深色
  - action: dtk_main_menu
    items:
    - 主题
    - 浅色
  - action: dtk_main_menu
    items:
    - 主题
    - 跟随系统
  - action: assert_element
    selector:
      name: Form_DMainWindow
      role: form
- id: suite_主菜单_006_s1
  name: 主菜单-放大镜启用与取消
  module: 主菜单
  annotation:
    测试界面: 主菜单（放大镜）+ 文档区（Form_DocSheet）
    测试功能: 主菜单→放大镜启用放大镜，Esc/右键取消放大镜，窗口正常
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{DTitlebarMainMenu 放大镜}'
    - '{Form_DocSheet}'
  steps:
  - action: dtk_main_menu
    items:
    - 放大镜
  - action: keyboard_press
    key: escape
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
- id: suite_主菜单_007_s1
  name: 标题栏-最大化与无修改直接关闭
  module: 主菜单
  annotation:
    测试界面: 标题栏（DTitlebarDWindowMaxButton / DTitlebarDWindowCloseButton）
    测试功能: 点击标题栏最大化按钮，点击关闭按钮在无修改场景下直接关闭（最小化需任务栏交互，标注不可自动化）
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{DTitlebarDWindowMaxButton}'
    - '{DTitlebarDWindowCloseButton}'
    - '{Form_DMainWindow}'
  steps:
  - action: element_action
    selector:
      name: DTitlebarDWindowMaxButton
      role: button
    do: click
  - action: element_action
    selector:
      name: DTitlebarDWindowCloseButton
      role: button
    do: click
  - action: assert_element
    selector:
      name: Form_DMainWindow
      role: form
  - action: assert_window
- id: suite_主菜单_008_s1
  name: 主菜单-无修改直接退出
  module: 主菜单
  annotation:
    测试界面: 主菜单（退出）+ 主窗口（Form_DMainWindow）
    测试功能: 未修改文档时主菜单→退出，直接退出无提示弹框，窗口关闭（修改后保存确认弹框场景不可自动化，已另说明）
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{DTitlebarMainMenu 退出}'
    - '{Form_DocSheet}'
    - '{Form_DMainWindow}'
  steps:
  - action: dtk_main_menu
    items:
    - 退出
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
  - action: assert_window
- id: suite_交互_其它交互_001_s1
  name: 快捷键_Ctrl+Home/Ctrl+End 定位与侧边栏联动
  module: 交互_其它交互
  annotation:
    测试界面: 文档区（Form_DocSheet / Form_CentralDocPage）+ 侧边栏（Form_SheetSidebar）
    测试功能: Ctrl+Home 定位首页、Ctrl+End 定位末尾，并联动切换缩略图/书签/注释侧边栏目录（缩略图/书签页的高亮定位为纯视觉部分，已在 unsupported
      说明）
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{Form_DocSheet}'
    - '{Button_thumbnail}'
    - '{Button_bookmark}'
    - '{Button_annotation}'
    - '{Form_ThumbnailWidget}'
    - '{Form_BookMarkWidget}'
    - '{Form_NotesWidget}'
  steps:
  - action: keyboard_hot_key
    key: ctrl+home
  - action: keyboard_hot_key
    key: ctrl+end
  - action: element_action
    selector:
      name: Button_thumbnail
      role: check box
    do: click
  - action: element_action
    selector:
      name: Button_bookmark
      role: check box
    do: click
  - action: element_action
    selector:
      name: Button_annotation
      role: check box
    do: click
  - action: assert_element
    selector:
      name: Form_ThumbnailWidget
      role: form
  - action: assert_element
    selector:
      name: Form_BookMarkWidget
      role: form
  - action: assert_element
    selector:
      name: Form_NotesWidget
      role: form
- id: suite_交互_其它交互_002_s1
  name: 快捷键-文件操作（Ctrl+O/Ctrl+S/Ctrl+Shift+S）
  module: 交互_其它交互
  annotation:
    测试界面: 文档区（Form_CentralDocPage）+ 系统文件对话框
    测试功能: Ctrl+O 打开文件选择界面并选文件、Ctrl+S 保存、Ctrl+Shift+S 另存为（弹出系统保存对话框选择路径保存）
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{Form_CentralDocPage}'
    - '{Form_DocSheet}'
  steps:
  - action: keyboard_hot_key
    key: ctrl+o
    wait: 1.0
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/test_file.pdf
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+s
  - action: keyboard_hot_key
    key: ctrl+shift+s
    wait: 1.0
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/save_copy_test.pdf
    wait: 3.0
  - action: assert_element
    selector:
      name: Form_CentralDocPage
      role: form
  - action: assert_element
    selector:
      name: Form_CentralDocPage
      role: form
- id: suite_交互_其它交互_003_s1
  name: 快捷键-文档视图（缩放/旋转/翻页/工具）
  module: 交互_其它交互
  annotation:
    测试界面: 文档区（Form_DocSheet）
    测试功能: 文档视图快捷键冒烟：Ctrl+1/2/3 默认大小/适应高度/适应宽度、Ctrl+R/Ctrl+Shift+R 左/右旋转、Ctrl++/Ctrl+-
      页面放大缩小、PageUp/PageDown 上下翻页、Up/Down 上下滚动，连续操作后文档区保持正常
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{Form_DocSheet}'
  steps:
  - action: keyboard_hot_key
    key: ctrl+1
  - action: keyboard_hot_key
    key: ctrl+2
  - action: keyboard_hot_key
    key: ctrl+3
  - action: keyboard_hot_key
    key: ctrl+r
  - action: keyboard_hot_key
    key: ctrl+shift+r
  - action: keyboard_hot_key
    key: ctrl+add
  - action: keyboard_hot_key
    key: ctrl+subtract
  - action: keyboard_press
    key: pagedown
  - action: keyboard_press
    key: pageup
  - action: keyboard_press
    key: down
  - action: keyboard_press
    key: up
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
- id: suite_交互_其它交互_004_s1
  name: 快捷键-全屏切换（F11/Esc）
  module: 交互_其它交互
  annotation:
    测试界面: 文档区（Form_DocSheet）+ 全屏状态标题栏（DTitlebarDWindowQuitFullscreenButton）
    测试功能: F11 进入全屏（标题栏出现退出全屏按钮），Esc 退出全屏（退出全屏按钮消失）
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{Form_DocSheet}'
    - '{DTitlebarDWindowQuitFullscreenButton}'
  steps:
  - action: keyboard_press
    key: f11
  - action: keyboard_press
    key: escape
  - action: assert_element
    selector:
      name: DTitlebarDWindowQuitFullscreenButton
      role: button
  - action: assert_not_exists
    selector:
      name: DTitlebarDWindowQuitFullscreenButton
      role: button
