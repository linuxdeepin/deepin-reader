=== 格式范例 ===
# 格式说明：
# 每个 case 包含 id, name, module, steps
# steps 中每个 step 包含 action 和对应参数
# 菜单操作使用 dtk_main_menu/dtk_context_menu
# 文件对话框使用 file_dialog_select/file_dialog_cancel
# 断言使用 assert_element/assert_not_exists/assert_window
# 键盘操作使用 keyboard_press/keyboard_hot_key/keyboard_type
# 元素选择器使用 name + role 定位
=== 格式范例 ===

version: '1.0'
cases:
- id: suite_主菜单_case_1581267_s1
  name: '[007]保存'
  module: 主菜单
  steps:
  - action: dtk_main_menu
    items:
    - 保存
  - action: assert_element
    selector:
      name: 保存
      role: menu item
- id: suite_主菜单_case_1581231_s1
  name: '[004]最小化. 最大化. 关闭'
  module: 主菜单
  steps:
  - action: element_action
    selector:
      name: DTitlebarDWindowMinButton
      role: button
    do: click
  - action: wait
    wait: 1.0
  - action: element_action
