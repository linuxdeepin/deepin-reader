cases:
- id: suite_main_no_doc
  name: 主界面 — 无文档打开 — 打开文件
  module: 主界面 — 无文档打开
  status: active
  annotation:
    测试界面: 主界面-无文档打开
    测试功能: 无文档时主界面显示与文件打开按钮
    前置条件: deepin-reader 已启动，未打开任何文档
    AT元素引用: ["Button_SelectFile"]
  steps:
  - step_type: action
    description: 启动 deepin-reader，不打开任何文档
    action: session_start
    command: deepin-reader
  - step_type: assert
    description: 主界面显示打开文件按钮(Button_SelectFile)
    action: assert_element
    selector:
      name: Button_SelectFile
      role: button
  - step_type: action
    description: 点击打开文件按钮
    action: mouse_click
    selector:
      name: Button_SelectFile
      role: button
  - step_type: assert
    description: 检查文件选择对话框弹出
    action: assert_element
    selector:
      name: Button_SelectFile
      role: button
- id: suite_titlebar_main_menu
  name: 标题栏主菜单 — 菜单项导航
  module: 标题栏主菜单
  status: active
  annotation:
    测试界面: 标题栏-主菜单
    测试功能: 主菜单项导航(新窗口/新建标签/保存/搜索/打印/工具/主题)
    前置条件: deepin-reader 已打开一个 PDF 文档
    AT元素引用: ["DTitlebarMainMenu"]
  steps:
  - step_type: action
    description: 启动 deepin-reader 并打开文档
    action: session_start
    command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  - step_type: action
    description: 打开主菜单，选择"新窗口"
    action: dtk_main_menu
    items:
    - 新窗口
  - step_type: action
    description: 打开主菜单，选择"新标签页"
    action: dtk_main_menu
    items:
    - 新标签页
  - step_type: action
    description: 打开主菜单，选择"保存"
    action: dtk_main_menu
    items:
    - 保存
  - step_type: action
    description: 打开主菜单，选择"搜索"
    action: dtk_main_menu
    items:
    - 搜索
  - step_type: action
    description: 按ESC关闭搜索框
    action: keyboard_press
    key: Escape
  - step_type: action
    description: 打开主菜单，选择"工具"→"选择工具"
    action: dtk_main_menu
    items:
    - 工具
    - 选择工具
  - step_type: action
    description: 打开主菜单，选择"工具"→"手形工具"
    action: dtk_main_menu
    items:
    - 工具
    - 手形工具
  - step_type: action
    description: 打开主菜单，选择"打印"
    action: dtk_main_menu
    items:
    - 打印
  - step_type: action
    description: 关闭打印对话框
    action: keyboard_press
    key: Escape
  - step_type: assert
    description: 验证菜单操作后应用仍正常响应
    action: assert_element
    selector:
      name: Button_SelectFile
      role: button
