- id: suite_交互_触摸屏_002_s1
  name: 单指单击侧边栏与任意缩略图切换
  module: 交互_触摸屏
  annotation:
    测试界面: 左侧边栏（Form_SheetSidebar）缩略图/目录/书签/注释
    测试功能: 单指点（mouse_click）：展开左侧栏后依次点按书签/目录/缩略图/注释功能，再点按任意缩略图完成选择切换
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{Button_ThumbnailToggle}'
    - '{Button_catalog}'
    - '{Button_bookmark}'
    - '{Button_annotation}'
    - '{Button_thumbnail}'
    - '{View_ImageList}'
    - '{Form_CatalogWidget}'
    - '{Form_BookMarkWidget}'
    - '{Form_NotesWidget}'
    - '{Form_ThumbnailWidget}'
  steps:
  - action: mouse_click
    selector:
      name: Button_ThumbnailToggle
      role: check box
  - action: mouse_click
    selector:
      name: Button_catalog
      role: check box
  - action: mouse_click
    selector:
      name: Button_bookmark
      role: check box
  - action: mouse_click
    selector:
      name: Button_annotation
      role: check box
  - action: mouse_click
    selector:
      name: Button_thumbnail
      role: check box
  - action: mouse_click
    selector:
      name: View_ImageList
      role: list
      child_index: 0
  - action: assert_element
    selector:
      name: Form_CatalogWidget
      role: form
  - action: assert_element
    selector:
      name: Form_BookMarkWidget
      role: form
  - action: assert_element
    selector:
      name: Form_NotesWidget
      role: form
  - action: assert_element
    selector:
      name: Form_ThumbnailWidget
      role: form
  - action: assert_element
    selector:
      name: View_ImageList
      role: list
- id: suite_交互_触摸屏_003_s1
  name: 单指单击缩放下拉框切换视图方式
  module: 交互_触摸屏
  annotation:
    测试界面: 标题栏缩放下拉/编辑框（DLineEditChildLineEdit）
    测试功能: 单指点（mouse_click）放大缩小下拉框，通过缩放比例切换视图方式并可正常应用
    前置条件: 应用已启动，已打开 PDF 文档
    AT元素引用:
    - '{DLineEditChildLineEdit}'
    - '{Form_DocSheet}'
  steps:
  - action: mouse_click
    selector:
      name: DLineEditChildLineEdit
      role: text
  - action: keyboard_hot_key
    key: ctrl+a
  - action: keyboard_type
    text: '120'
  - action: keyboard_press
    key: Return
  - action: assert_element
    selector:
      name: DLineEditChildLineEdit
      role: text
