# === 格式范例 ===
# cases:
#   - name: suite名称
#     module: 模块名
#     steps:
#       - step_type: action
#         action: session_start
#         command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
#       - step_type: action
#         action: mouse_click
#         selector: {name: Button_xxx}
#       - step_type: action
#         action: dtk_main_menu
#         items: [主题, 浅色]
#       - step_type: assert
#         action: assert_element
#         selector: {name: Button_xxx}
# === 格式范例结束 ===

version: '1.0'
cases:
- id: suite_main_no_doc
  name: 主界面 — 无文档打开
  module: 导航页(无文档)
  annotation:
    测试界面: 导航页(无文档)
    测试功能: 无文档首页和打开文件
    前置条件: deepin-reader 已启动，未打开任何文档
    AT元素: Button_SelectFile, Label_Icon, Label_Drag documents here
  steps:
  - step_type: action
    description: 启动 deepin-reader，不打开文档
    action: session_start
    command: deepin-reader
  - step_type: assert
    description: 检查打开文件按钮可见
    action: assert_element
    selector:
      name: Button_SelectFile
      role: button
  - step_type: assert
    description: 确认应用运行正常
    action: assert_element
    selector:
      name: Form_DMainWindow
      role: form
- id: suite_select_file
  name: 导航页 — 选择文件按钮
  module: 导航页(无文档)
  annotation:
    测试界面: 导航页(无文档)
    测试功能: 选择文件按钮功能
    前置条件: deepin-reader 已启动，未打开任何文档
    AT元素: Button_SelectFile
  steps:
  - step_type: action
    description: 启动 deepin-reader
    action: session_start
    command: deepin-reader
  - step_type: action
    description: 点击选择文件按钮
    action: mouse_click
    selector:
      name: Button_SelectFile
      role: button
  - step_type: assert
    description: 系统文件选择对话框弹出
    action: assert_element
    selector:
      name: Form_DMainWindow
      role: form
  - step_type: assert
    description: 确认应用运行正常
    action: assert_element
    selector:
      name: Form_DMainWindow
      role: form
