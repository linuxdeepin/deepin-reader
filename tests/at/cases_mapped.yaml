# === 格式范例 ===
# 此文件由 pipeline_assemble.py 从 modules/*.output.json 组装生成，格式如下:
# cases:
#   - id: suite_<模块>_<序号>_s1
#     name: suite名称
#     module: 模块名
#     annotation:
#       测试界面: ...
#       测试功能: ...
#       前置条件: ...
#       AT元素引用: [真实元素名]
#     steps:
#       - step_type: action
#         action: session_start
#         command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
version: '1.0'
cases:
- id: suite_主菜单_001_s1
  name: 保存与另存功能
  module: 主菜单
  annotation:
    测试界面: 主菜单 (DTitlebarMainMenu)
    测试功能: 保存、另存为、多次保存、保存替换文档
    前置条件: 应用已启动并已打开一份文档
    AT元素引用:
    - 保存
    - 另存为
    - DTitlebarDWindowOptionButton
  steps:
  - action: dtk_main_menu
    items:
    - 保存
  - action: keyboard_hot_key
    key: ctrl+s
  - action: dtk_main_menu
    items:
    - 保存
  - action: dtk_main_menu
    items:
    - 另存为
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/saved_new.pdf
    wait: 3.0
  - action: dtk_main_menu
    items:
    - 另存为
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/saved_unedited.pdf
    wait: 3.0
  - action: dtk_main_menu
    items:
    - 另存为
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/saved_replace.pdf
    wait: 3.0
  - action: dtk_main_menu
    items:
    - 另存为
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/saved_replace.pdf
    wait: 3.0
  - action: assert_element
    selector:
      name: 保存
      role: menu item
  - action: assert_element
    selector:
      name: 保存
      role: menu item
  - action: assert_element
    selector:
      name: 保存
      role: menu item
  - action: assert_element
    selector:
      name: 另存为
      role: menu item
  - action: assert_element
    selector:
      name: 另存为
      role: menu item
  - action: assert_element
    selector:
      name: 另存为
      role: menu item
- id: suite_主菜单_002_s1
  name: 窗口控制与多窗口
  module: 主菜单
  annotation:
    测试界面: 主菜单 (DTitlebarMainMenu) 与标题栏按钮
    测试功能: 最小化、最大化、关闭、退出、新标签页、新窗口
    前置条件: 应用已启动并已打开一份文档
    AT元素引用:
    - 最小化窗口
    - 最大化/还原窗口
    - 关闭窗口
    - 退出
    - 新窗口
    - 新标签页
    - DTitlebarDWindowMinButton
    - DTitlebarDWindowCloseButton
  steps:
  - action: dtk_main_menu
    items:
    - 退出
  - action: dtk_main_menu
    items:
    - 退出
  - action: dtk_main_menu
    items:
    - 新标签页
  - action: dtk_main_menu
    items:
    - 新窗口
  - action: dtk_main_menu
    items:
    - 新窗口
  - action: dtk_main_menu
    items:
    - 关于
  - action: assert_element
    selector:
      name: 最小化窗口
      role: menu item
  - action: assert_element
    selector:
      name: 退出
      role: menu item
  - action: assert_element
    selector:
      name: 退出
      role: menu item
  - action: assert_element
    selector:
      name: 新标签页
      role: menu item
  - action: assert_element
    selector:
      name: 新窗口
      role: menu item
  - action: assert_element
    selector:
      name: 新窗口
      role: menu item
  - action: assert_element
    selector:
      name: 关于
      role: menu item
