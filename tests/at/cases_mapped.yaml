# 格式范例 — cases_mapped.yaml
# 此文件由 LLM 从 suite-cases.yaml 映射生成，格式如下:
# cases:
#   - name: suite名称
#     module: 模块名
#     steps:
#       - step_type: action
#         action: session_start
#         command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
#       - step_type: action
#         action: mouse_click
#         selector: {name: Button_xxx}
#       - step_type: action
#         action: dtk_main_menu
#         items: [主题, 浅色]
#       - step_type: action
#         action: dtk_context_menu
#         selector: {name: pageEdit}
#         items: [搜索]
#       - step_type: assert
#         action: assert_element
#         selector: {name: Button_xxx}
version: '1.0'
cases:
- id: suite_main_no_doc
  name: 主界面 — 无文档打开 — 打开文件
  module: 主界面 — 无文档打开
  annotation:
    测试界面: 主界面 — 无文档打开
    测试功能: 打开文件
    前置条件: deepin-reader 已启动，未打开任何文档
    AT元素: n6 (Button_SelectFile, button, 打开文件选择对话框)
  steps:
  - step_type: action
    description: 启动 deepin-reader，不打开任何文档
    action: session_start
    command: deepin-reader
  - step_type: assert
    description: 主界面显示打开文件按钮(Button_SelectFile)
    element_ref: n6
    selector:
      name: Button_SelectFile
    action: assert_element
  - step_type: action
    description: 点击打开文件按钮
    element_ref: n6
    selector:
      name: Button_SelectFile
    action: mouse_click
- id: suite_sidebar_tabs
  name: 左侧栏 — 按钮切换 — 缩略图/目录/书签/注释
  module: 左侧栏 — 按钮切换
  annotation:
    测试界面: 左侧栏 — 按钮切换
    测试功能: 侧边栏四个功能按钮切换（缩略图/目录/书签/注释）
    前置条件: deepin-reader 已打开一个 PDF 文档
    AT元素: n14 (Button_thumbnail), n15 (Button_catalog), n16 (Button_bookmark), n17 (Button_annotation), n18 (Button_search), n163 (View_CatalogTree), n22 (Button_BookmarkAdd), n49 (Button_NotesAdd)
  steps:
  - step_type: action
    description: 启动 deepin-reader并打开文档
    action: session_start
    command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  - step_type: action
    description: 点击标题栏缩略图切换按钮展开侧边栏
    element_ref: n224
    selector:
      name: Button_ThumbnailToggle
    action: mouse_click
  - step_type: action
    description: 打开文档，展开左侧栏，点击缩略图按钮
    element_ref: n14
    selector:
      name: Button_thumbnail
    action: mouse_click
  - step_type: assert
    description: 缩略图按钮可点击，界面保持响应
    element_ref: n14
    selector:
      name: Button_thumbnail
    action: assert_element
  - step_type: action
    description: 点击目录按钮
    element_ref: n15
    selector:
      name: Button_catalog
    action: mouse_click
  - step_type: assert
    description: 显示目录视图(View_CatalogTree)
    element_ref: n163
    selector:
      name: View_CatalogTree
    action: assert_element
  - step_type: action
    description: 点击书签按钮
    element_ref: n16
    selector:
      name: Button_bookmark
    action: mouse_click
  - step_type: assert
    description: 显示书签视图，含添加书签按钮(Button_BookmarkAdd)
    element_ref: n22
    selector:
      name: Button_BookmarkAdd
    action: assert_element
  - step_type: action
    description: 点击注释按钮
    element_ref: n17
    selector:
      name: Button_annotation
    action: mouse_click
  - step_type: assert
    description: 显示注释视图，含添加注释按钮(Button_NotesAdd)
    element_ref: n49
    selector:
      name: Button_NotesAdd
    action: assert_element
- id: suite_sidebar_thumbnails
  name: 左侧栏 — 缩略图视图 — 分页导航
  module: 左侧栏 — 缩略图视图
  annotation:
    测试界面: 左侧栏 — 缩略图视图
    测试功能: 缩略图分页导航
    前置条件: deepin-reader 已打开一个多页 PDF 文档，左侧栏展开且选中缩略图视图
    AT元素: n14 (Button_thumbnail, check box, 切换到缩略图视图), n156 (pageEdit, text, 输入页码跳转), n158 (Button_ThumbnailPre, button, 上一页缩略图), n159 (Button_ThumbnailNext, button, 下一页缩略图)
  steps:
  - step_type: action
    description: 启动 deepin-reader并打开文档
    action: session_start
    command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  - step_type: action
    description: 点击标题栏缩略图切换按钮展开侧边栏
    element_ref: n224
    selector:
      name: Button_ThumbnailToggle
    action: mouse_click
  - step_type: action
    description: 展开左侧栏，点击缩略图按钮切换到缩略图视图
    element_ref: n14
    selector:
      name: Button_thumbnail
    action: mouse_click
  - step_type: action
    description: 点击底部页数框(pageEdit)以聚焦
    element_ref: n156
    selector:
      name: pageEdit
      role: text
    action: mouse_click
  - step_type: action
    description: 删除底部页数框(pageEdit)中的数值
    element_ref: n156
    selector:
      name: pageEdit
      role: text
    action: keyboard_press
    key: BackSpace
  - step_type: action
    description: 按Escape键取消编辑，让输入框恢复原值
    action: keyboard_press
    key: Escape
  - step_type: assert
    description: 输入框中应该再次显示最近一次的数据
    element_ref: n156
    selector:
      name: pageEdit
      role: text
    action: assert_element
- id: suite_tab_management
  name: 顶部标签页栏 — 添加/滚动/切换
  module: 顶部标签页栏
  annotation:
    测试界面: 顶部标签页栏
    测试功能: 标签页添加、滚动、关闭
    前置条件: deepin-reader 已打开一个 PDF 文档
    AT元素: n209 (page tab list, 已打开文档的标签页列表), n210 (page tab, normal.pdf文档标签页), n211 (向左滚动, button, 标签页向左滚动), n212 (向右滚动, button, 标签页向右滚动), n213 (DTabBarAddButton, button, 新建标签页)
  steps:
  - step_type: action
    description: 启动 deepin-reader并打开文档
    action: session_start
    command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  - step_type: action
    description: 点击/断言标签页 normal.pdf
    element_ref: n210
    selector:
      name: normal.pdf
      role: page tab
    action: mouse_click
  - step_type: assert
    description: 点击/断言标签页 normal.pdf
    element_ref: n209
    selector:
      name: normal.pdf
      role: page tab
    action: assert_element
  - step_type: assert
    description: 点击/断言标签页 normal.pdf
    element_ref: n211
    selector:
      name: normal.pdf
      role: page tab
    action: assert_element
  - step_type: assert
    description: 点击/断言标签页 normal.pdf
    element_ref: n212
    selector:
      name: normal.pdf
      role: page tab
    action: assert_element
- id: suite_titlebar_search
  name: 标题栏搜索框 — 关键字输入/清除/搜索
  module: 标题栏搜索框
  annotation:
    测试界面: 标题栏搜索框
    测试功能: 搜索关键字输入、清除、搜索执行
    前置条件: deepin-reader 已打开一个 PDF 文档
    AT元素: n243 (DLineEditChildLineEdit, text, 输入搜索关键词), n244 (DLineEditClearButton, button, 清除搜索内容), n245 (DSearchEditIconButton, button, 搜索按钮)
  steps:
  - step_type: action
    description: 启动 deepin-reader并打开文档
    action: session_start
    command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  - step_type: action
    description: 通过主菜单打开搜索框
    action: dtk_main_menu
    items:
    - 搜索
  - step_type: action
    description: 点击搜索输入框以聚焦
    element_ref: n243
    selector:
      name: DLineEditChildLineEdit
      parent: Form_findSearchEdit_P
    action: mouse_click
  - step_type: action
    description: 在搜索框输入关键字test
    element_ref: n243
    selector:
      name: DLineEditChildLineEdit
      parent: Form_findSearchEdit_P
    action: keyboard_type_text
    text: test
  - step_type: action
    description: 按Enter键执行搜索
    action: keyboard_press
    key: Return
  - step_type: assert
    description: 正常显示搜索结果，搜索框仍然可见
    element_ref: n243
    selector:
      name: DLineEditChildLineEdit
      parent: Form_findSearchEdit_P
    action: assert_element
  - step_type: action
    description: 点击搜索框右侧清除按钮(DLineEditClearButton)
    element_ref: n244
    selector:
      name: DLineEditClearButton
      parent: Form_findSearchEdit_P
    action: mouse_click
  - step_type: assert
    description: 可以正常关闭搜索，搜索框仍然可见
    element_ref: n243
    selector:
      name: DLineEditChildLineEdit
      parent: Form_findSearchEdit_P
    action: assert_element
- id: suite_titlebar_scale
  name: 标题栏缩放输入框 — 缩放比例输入
  module: 标题栏缩放输入框
  annotation:
    测试界面: 标题栏缩放输入框
    测试功能: 缩放比例输入
    前置条件: deepin-reader 已打开一个 PDF 文档
    AT元素: n227 (DLineEditChildLineEdit, text, 输入缩放比例)
  steps:
  - step_type: action
    description: 启动 deepin-reader并打开文档
    action: session_start
    command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  - step_type: action
    description: 点击百分比图标编辑框以聚焦
    element_ref: n227
    selector:
      name: DLineEditChildLineEdit
    action: mouse_click
  - step_type: action
    description: 输入新的缩放比例
    element_ref: n227
    selector:
      name: DLineEditChildLineEdit
      role: text
    action: keyboard_type_text
    text: '100'
  - step_type: action
    description: 按Enter键确认缩放比例
    action: keyboard_press
    key: Return
  - step_type: assert
    description: 缩放输入框仍然可见，文档按输入的缩放比例显示
    element_ref: n227
    selector:
      name: DLineEditChildLineEdit
    action: assert_element
- id: suite_sidebar_catalog
  name: 左侧栏 — 目录视图 — 目录树显示和点击跳转
