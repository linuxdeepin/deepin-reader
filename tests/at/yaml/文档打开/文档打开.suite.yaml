      name: Form_CentralNavPage
- id: suite_文档打开_018_s1
  name: '[031]Ctrl+S和Ctrl+Shift+S快捷键'
  description: ''
  steps:
  - action: keyboard_hot_key
    key: ctrl+o
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/normal.docx
  - action: keyboard_hot_key
