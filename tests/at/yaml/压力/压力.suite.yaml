name: 压力_suite
app: deepin-reader
module: 压力
setup:
- action: session_start
  command: deepin-reader
  wait: 3.0
suites:
- id: suite_压力_001_s1
  name: 单次添加书签（批量添加场景的可自动化子动作）
  description: ''
  annotation:
    测试界面: 侧边栏-书签目录（Form_BookMarkWidget）
    测试功能: 批量添加100个书签属于性能/压力场景，整体不可自动化；取其中可自动化的子动作（打开书签目录、单次点击添加书签）做最小覆盖
    前置条件: 应用已启动
    AT元素引用:
    - Button_bookmark
    - Button_BookmarkAdd
    - Form_BookMarkWidget
  steps:
  - action: element_action
    selector:
      name: Button_bookmark
      role: check box
    do: click
  - action: element_action
    selector:
      name: Button_BookmarkAdd
      role: button
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: Form_BookMarkWidget
      role: form
