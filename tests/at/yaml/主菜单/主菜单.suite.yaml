name: 主菜单_suite
app: deepin-reader
module: 主菜单
setup:
- action: session_start
  command: deepin-reader
  wait: 3.0
suites:
- id: suite_主菜单_case_1581267_s1
  name: '[007]保存'
  description: ''
  steps:
  - action: dtk_main_menu
    items:
    - 保存
  assert_steps:
  - action: assert_element
    selector:
      name: 保存
      role: menu item
