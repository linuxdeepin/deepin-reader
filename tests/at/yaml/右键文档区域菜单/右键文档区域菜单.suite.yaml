name: 右键文档区域菜单_suite
app: deepin-reader
description: ''
module: 右键文档区域菜单
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  wait: 3.0
suites:
- id: suite_context_menu_doc_s1
  name: 启动 deepin-reader 并打开文档
  description: ''
  tags: []
  steps:
  - action: dtk_context_menu
    selector:
      name: Form_CentralDocPage
      role: form
    items:
    - 搜索
  - action: keyboard_press
    key: escape
  - action: dtk_context_menu
    selector:
      name: Form_CentralDocPage
      role: form
    items:
    - 最后一页
  - action: dtk_context_menu
    selector:
      name: Form_CentralDocPage
      role: form
    items:
    - 第一页
  assert_steps:
  - action: assert_element
    selector:
      name: Form_CentralDocPage
      role: form
teardown:
- action: session_stop
