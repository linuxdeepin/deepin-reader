name: 键盘交互_suite
app: deepin-reader
description: ''
module: 键盘交互
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  wait: 3.0
suites:
- id: suite_keyboard_s1
  name: 键盘快捷键交互
  description: ''
  tags: []
  steps:
  - action: keyboard_hot_key
    key: ctrl+f
  - action: keyboard_press
    key: escape
  assert_steps:
  - action: assert_element
    selector:
      name: Button_SelectFile
      role: button
teardown:
- action: session_stop
