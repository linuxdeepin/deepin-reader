name: 文档视图_操作_suite
app: deepin-reader
module: 文档视图_操作
setup:
- action: session_start
  command: deepin-reader
  wait: 3.0
suites:
- id: suite_文档视图_操作_001_s1
  name: 搜索-多次搜索（输入_删除_重输入）
  description: ''
  annotation:
    测试界面: 搜索框 + 侧边栏 Form_SearchResWidget
    测试功能: 输入关键字搜索、退格删除后重输入另一关键字再搜索，结果侧栏正确刷新不叠加
    前置条件: 已打开 PDF 文档
    AT元素引用:
    - Form_SearchResWidget
    - Button_search
    - Form_DocSheet
  steps:
  - action: element_action
    selector:
      name: Button_SelectFile
      role: button
    do: click
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/normal.pdf
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+f
  - action: keyboard_type
    text: user
  - action: keyboard_press
    key: Return
  - action: keyboard_press
    key: BackSpace
  - action: keyboard_type
    text: system
  - action: keyboard_press
    key: Return
  assert_steps:
  - action: assert_element
    selector:
      name: Form_SearchResWidget
      role: form
  - action: assert_element
    selector:
      name: Form_SearchResWidget
      role: form
- id: suite_文档视图_操作_002_s1
