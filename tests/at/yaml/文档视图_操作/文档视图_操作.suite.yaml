    前置条件: 已打开 PDF 文档
    AT元素引用:
    - Form_SearchResWidget
    - Form_DocSheet
  steps:
  - action: element_action
    selector:
      name: Button_SelectFile
      role: button
    do: click
  - action: file_dialog_select
