name: 文档视图_操作_suite
app: deepin-reader
module: 文档视图_操作
setup:
- action: session_start
  command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  wait: 3.0
suites:
- id: suite_文档视图_操作_001_s1
  name: 缩放比例输入框数值删除后恢复与百分比输入
  description: ''
  annotation:
    测试界面: 标题栏缩放控件（Form_scaleEdit_P）/ 缩略图分页区（Form_Paging）
    测试功能: 删除缩放比例输入框与页码输入框数值后点击窗口内外，输入框恢复最近一次数据；输入10%-500%百分比按Enter调整
    前置条件: 启动 deepin-reader 并打开文档
    AT元素引用:
    - DLineEditChildLineEdit
    - pageEdit
  steps:
  - action: element_action
    selector:
      name: pageEdit
      role: text
    do: click
  - action: keyboard_type
    selector:
      name: pageEdit
      role: text
    text: 删除数值
  - action: mouse_right_click
    selector:
      name: pageEdit
      role: text
  - action: element_action
    selector:
      name: DLineEditChildLineEdit
      role: text
    do: click
  - action: keyboard_type
    selector:
      name: DLineEditChildLineEdit
      role: text
    text: 删除数值
  - action: mouse_right_click
    selector:
      name: pageEdit
      role: text
  assert_steps:
  - action: assert_element
    selector:
      name: pageEdit
      role: text
    do: assert_exists
  - action: assert_element
    selector:
      name: DLineEditChildLineEdit
      role: text
    do: assert_exists
- id: suite_文档视图_操作_002_s1
  name: 缩放比例编辑框输入百分比与+/-按钮
  description: ''
  annotation:
    测试界面: 标题栏缩放控件（Form_scaleEdit_P）
    测试功能: 在缩放比例输入框输入10%-500%范围百分比（保留两位小数）按Enter调整，+/-按钮调整为最近比例
    前置条件: 启动 deepin-reader 并打开文档
    AT元素引用:
    - DLineEditChildLineEdit
  steps:
  - action: element_action
    selector:
      name: DLineEditChildLineEdit
      role: text
    do: click
  - action: keyboard_type
    selector:
      name: DLineEditChildLineEdit
      role: text
    text: '137.55'
  - action: keyboard_press
    key: Enter
  - action: element_action
    selector:
      name: DLineEditChildLineEdit
      role: text
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: DLineEditChildLineEdit
      role: text
    do: assert_exists
  - action: assert_ocr_exists
    text: 10%
