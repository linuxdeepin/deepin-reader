  description: ''
  annotation:
    测试界面: 幻灯片放映界面（播放控制区）
    测试功能: 进入幻灯片播放界面后，通过鼠标左击、方向键/方向键、鼠标滚轮切换上一页与下一页
    前置条件: 应用已启动并已打开一份文档
    AT元素引用:
    - pageEdit
    - dtk_context_menu
    - 幻灯片放映
  steps:
  - action: mouse_right_click
    selector:
      name: pageEdit
      role: text
  - action: element_action
    selector:
      name: 幻灯片放映
      role: menu item
    do: click
  - action: mouse_click
    selector:
      name: pageEdit
      role: text
  - action: keyboard_press
    key: down
  - action: keyboard_press
    key: up
  - action: keyboard_press
    key: escape
  assert_steps:
  - action: assert_element
    selector:
      name: 幻灯片放映
      role: menu item
    do: assert_exists
  - action: assert_element
    selector:
      name: pageEdit
      role: text
    do: assert_exists
  - action: assert_element
    selector:
      name: pageEdit
      role: text
    do: assert_exists
  - action: assert_element
    selector:
      name: pageEdit
      role: text
    do: assert_exists
