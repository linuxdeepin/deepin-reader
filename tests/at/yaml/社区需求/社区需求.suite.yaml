name: 社区需求_suite
app: deepin-reader
module: 社区需求
setup:
- action: session_start
  command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  wait: 3.0
- action: session_start
  command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  wait: 3.0
suites:
- id: suite_社区需求_001_s1
  name: 幻灯片放映进入与暂停及UI展示
  description: ''
  annotation:
    测试界面: 文档阅读区 (Form_CentralDocPage) 右键菜单 (dtk_context_menu) / 幻灯片放映界面
    测试功能: 通过右键菜单进入幻灯片放映，验证默认暂停播放、播放内容顶格不拉伸、菜单栏呼出后3秒自动隐藏（鼠标悬停不隐藏）的UI表现
    前置条件: 应用已启动并已打开一份PDF/DJVU/DOCX文档
    AT元素引用:
    - pageEdit
    - Form_CentralDocPage
    - dtk_context_menu
    - 幻灯片放映
  steps:
  - action: mouse_right_click
    selector:
      name: pageEdit
      role: text
  - action: element_action
    selector:
      name: 幻灯片放映
      role: menu item
    do: click
  - action: keyboard_press
    key: escape
  - action: mouse_right_click
    selector:
      name: pageEdit
      role: text
  - action: element_action
    selector:
      name: 幻灯片放映
      role: menu item
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: 幻灯片放映
      role: menu item
    do: assert_exists
  - action: assert_element
    selector:
      name: pageEdit
      role: text
    do: assert_exists
  - action: assert_element
    selector:
      name: pageEdit
      role: text
    do: assert_exists
  - action: assert_element
    selector:
      name: pageEdit
      role: text
    do: assert_exists
