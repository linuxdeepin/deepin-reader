      name: Form_DocSheet
      role: form
- id: suite_交互_键盘_007_s1
  name: 左侧栏目录上下切换与删除
  description: ''
  annotation:
    测试界面: 左侧栏-缩略图/目录/书签/注释目录（Form_ThumbnailWidget/Form_CatalogWidget/Form_BookMarkWidget/Form_NotesWidget）
    测试功能: 缩略图目录上下方向键/PageUp/PageDown 切换；目录树方向键切换；书签目录方向键切换并 Delete 删除；注释目录方向键切换并 Delete
      删除
    前置条件: 已打开 PDF 文档并展开左侧栏
    AT元素引用:
    - Button_ThumbnailToggle
    - Button_thumbnail
    - Button_catalog
    - Button_bookmark
    - Button_annotation
    - View_ImageList
    - View_CatalogTree
  steps:
  - action: element_action
    selector:
      name: Button_ThumbnailToggle
      role: check box
    do: click
  - action: element_action
    selector:
      name: Button_thumbnail
      role: check box
    do: click
  - action: keyboard_press
    key: Down
  - action: keyboard_press
    key: PageDown
  - action: keyboard_press
    key: PageUp
  - action: keyboard_press
    key: Up
  - action: element_action
    selector:
      name: Button_catalog
      role: check box
    do: click
  - action: keyboard_press
    key: Down
  - action: keyboard_press
    key: PageDown
  - action: keyboard_press
    key: PageUp
  - action: element_action
    selector:
      name: Button_bookmark
      role: check box
    do: click
  - action: keyboard_press
    key: Down
  - action: keyboard_press
    key: PageDown
  - action: keyboard_press
    key: PageUp
  - action: keyboard_press
    key: Delete
  - action: element_action
    selector:
      name: Button_annotation
      role: check box
    do: click
  - action: keyboard_press
    key: Down
  - action: keyboard_press
    key: PageDown
  - action: keyboard_press
    key: Delete
  assert_steps:
  - action: assert_element
    selector:
      name: View_ImageList
      role: list
  - action: assert_element
    selector:
      name: View_CatalogTree
      role: tree
  - action: assert_element
    selector:
      name: View_ImageList
      role: list
  - action: assert_element
    selector:
      name: View_ImageList
      role: list
- id: suite_交互_键盘_008_s1
  name: 选中输入框内容按Alt+M弹出菜单
  description: ''
  annotation:
    测试界面: 标题栏-缩放百分比输入框（DLineEditChildLineEdit）
    测试功能: 选中输入框内容后按 Alt+M 弹出右键菜单，方向键切换、左右展开/收起子菜单、回车执行、Esc 退出菜单且输入框仍在
    前置条件: 已打开 PDF 文档
    AT元素引用:
    - DLineEditChildLineEdit
  steps:
  - action: element_action
    selector:
      name: DLineEditChildLineEdit
      role: text
    do: click
  - action: keyboard_hot_key
    key: ctrl+a
  - action: keyboard_hot_key
    key: alt+m
  - action: keyboard_press
    key: Down
  - action: keyboard_press
    key: Up
  - action: keyboard_press
    key: Right
  - action: keyboard_press
    key: Left
  - action: keyboard_press
    key: Return
  - action: keyboard_press
    key: Escape
  assert_steps:
  - action: assert_element
