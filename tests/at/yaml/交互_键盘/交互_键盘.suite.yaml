name: 交互_键盘_suite
app: deepin-reader
module: 交互_键盘
setup:
- action: session_start
  command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  wait: 3.0
suites:
- id: suite_交互_键盘_001_s1
  name: Tab键焦点切换（侧边栏展开状态）
  description: ''
  annotation:
    测试界面: 文档查看器主界面（单/多文档、左侧栏展开/未展开）
    测试功能: 按Tab键在工具栏与左侧栏按钮间切换焦点，enter/空格执行选择
    前置条件: 启动 deepin-reader 并打开文档
    AT元素引用:
    - DTitlebarDWindowOptionButton
    - DTitlebarDWindowMinButton
    - DTitlebarDWindowMaxButton
    - Button_ThumbnailToggle
    - Button_thumbnail
    - Button_catalog
    - Button_bookmark
    - Button_annotation
    - Button_search
    - View_CatalogTree
    - View_ImageList
  steps:
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Enter
  assert_steps:
  - action: assert_element
    selector:
      name: DTitlebarDWindowMinButton
      role: button
    do: assert_exists
  - action: assert_element
    selector:
      name: DTitlebarDWindowMaxButton
      role: button
    do: assert_exists
- id: suite_交互_键盘_002_s1
  name: Tab键焦点切换（多文档侧边栏状态）
  description: ''
  annotation:
    测试界面: 多文档主界面（左侧栏展开/未展开）
    测试功能: 多文档状态下按Tab键在工具栏与左侧栏按钮间切换焦点
    前置条件: 启动 deepin-reader 并打开多个文档
    AT元素引用:
    - DTitlebarDWindowOptionButton
    - DTitlebarDWindowMinButton
    - DTitlebarDWindowMaxButton
    - Button_thumbnail
    - Button_catalog
    - Button_bookmark
    - Button_annotation
    - Button_search
    - View_CatalogTree
    - View_ImageList
  steps:
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Enter
  - action: keyboard_press
    key: Tab
  assert_steps:
  - action: assert_element
    selector:
      name: DTitlebarDWindowMinButton
      role: button
    do: assert_exists
  - action: assert_element
    selector:
      name: Button_thumbnail
      role: check box
    do: assert_exists
- id: suite_交互_键盘_003_s1
  name: 首页Tab键切换与主菜单按钮焦点
  description: ''
  annotation:
    测试界面: 文档查看器首页/主界面
    测试功能: Tab键在主菜单、最小化、最大化、选择文件按钮间切换，方向键操作主菜单
    前置条件: 启动 deepin-reader 并打开文档
    AT元素引用:
    - DTitlebarDWindowOptionButton
    - DTitlebarDWindowMinButton
    - DTitlebarDWindowMaxButton
    - Button_SelectFile
    - 新窗口
    - 新标签页
    - 保存
  steps:
  - action: keyboard_press
    key: Tab
  - action: element_action
    selector:
      name: DTitlebarDWindowOptionButton
      role: button
    do: click
  - action: dtk_main_menu
    selector:
      name: DTitlebarDWindowOptionButton
      role: button
    items:
    - 新窗口
  - action: keyboard_press
    key: Left
  - action: keyboard_press
    key: Right
  assert_steps:
  - action: assert_element
    selector:
      name: DTitlebarDWindowOptionButton
      role: button
    do: assert_exists
  - action: assert_element
    selector:
      name: 新窗口
      role: menu item
    do: assert_exists
  - action: assert_element
    selector:
      name: DTitlebarDWindowOptionButton
      role: button
    do: assert_exists
- id: suite_交互_键盘_004_s1
  name: 主菜单下拉界面键盘导航
  description: ''
  annotation:
    测试界面: 主菜单（DTitlebarMainMenu）
    测试功能: 打开主菜单，上下/左右方向键与enter/空格/esc导航
    前置条件: 启动 deepin-reader 并打开文档
    AT元素引用:
