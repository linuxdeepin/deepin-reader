name: 交互_键盘_suite
app: deepin-reader
module: 交互_键盘
setup:
- action: session_start
  command: deepin-reader
  wait: 3.0
suites:
- id: suite_交互_键盘_001_s1
  name: 首页Tab键切换与主菜单键盘导航
  description: ''
  annotation:
    测试界面: 主窗口-标题栏+首页（Form_CentralNavPage）
    测试功能: 首页打开状态下 Tab 键在标题栏按钮（主菜单/最小化/最大化）与选择文件按钮间循环切换焦点；回车/空格执行选择；主菜单弹出后方向键、Esc 键盘导航与退出
    前置条件: 应用启动进入首页，无文档打开
    AT元素引用:
    - DTitlebarIconLabel
    - DTitlebarDWindowMinButton
    - DTitlebarDWindowMaxButton
    - Button_SelectFile
    - Form_DMainWindow
  steps:
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Return
  - action: keyboard_press
    key: space
  - action: keyboard_press
    key: Down
  - action: keyboard_press
    key: Right
  - action: keyboard_press
    key: Left
  - action: keyboard_press
    key: Escape
  assert_steps:
  - action: assert_element
    selector:
      name: DTitlebarIconLabel
      role: button
  - action: assert_element
    selector:
      name: DTitlebarDWindowMinButton
      role: button
  - action: assert_element
    selector:
      name: DTitlebarDWindowMaxButton
      role: button
  - action: assert_element
    selector:
      name: Button_SelectFile
      role: button
  - action: assert_element
    selector:
      name: Form_DMainWindow
      role: form
- id: suite_交互_键盘_002_s1
  name: 单个文档Tab键切换（未展开/展开左侧栏）
  description: ''
  annotation:
    测试界面: 主窗口-工具栏+文档区（Form_DocSheet）+左侧栏（Form_SheetSidebar）
    测试功能: 单个文档打开时 Tab 键焦点从工具栏开始从上至下、从左至右依次切换；回车/空格执行选择；展开左侧栏后 Tab 焦点切换至侧栏目录
    前置条件: 已打开单个 PDF 文档；后半段展开左侧栏
    AT元素引用:
    - DTitlebarIconLabel
    - DLineEditChildLineEdit
    - DTitlebarDWindowMinButton
    - Form_DocSheet
    - Button_ThumbnailToggle
    - Button_thumbnail
    - Button_catalog
    - Form_SheetSidebar
  steps:
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Return
  - action: keyboard_press
    key: space
  - action: element_action
    selector:
      name: Button_ThumbnailToggle
      role: check box
    do: click
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  assert_steps:
  - action: assert_element
    selector:
      name: DTitlebarIconLabel
      role: button
  - action: assert_element
    selector:
      name: DLineEditChildLineEdit
      role: text
  - action: assert_element
    selector:
      name: DTitlebarDWindowMinButton
      role: button
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
  - action: assert_element
    selector:
      name: Button_thumbnail
      role: check box
  - action: assert_element
    selector:
      name: Button_catalog
      role: check box
  - action: assert_element
    selector:
      name: Form_SheetSidebar
      role: form
- id: suite_交互_键盘_003_s1
  name: 多个文档Tab键切换（含展开左侧栏）
  description: ''
  annotation:
    测试界面: 主窗口-标签栏（Form_DocTabBar）+文档区+左侧栏（Form_SheetSidebar）
    测试功能: 多个文档打开时 Tab 键焦点从工具栏开始切换；回车/空格执行选择；展开左侧栏后 Tab 焦点切换至侧栏目录
    前置条件: 已打开多个文档；后半段展开左侧栏
    AT元素引用:
    - DTabBarAddButton
    - DTitlebarIconLabel
    - DTitlebarDWindowMinButton
    - 多数字员工并行工作站.pdf
    - Button_ThumbnailToggle
    - Button_thumbnail
    - Form_SheetSidebar
  steps:
  - action: element_action
    selector:
      name: DTabBarAddButton
      role: button
    do: click
  - action: keyboard_hot_key
    key: ctrl+o
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/normal.pdf
    wait: 3.0
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Return
  - action: keyboard_press
    key: space
  - action: element_action
    selector:
      name: Button_ThumbnailToggle
      role: check box
    do: click
  - action: keyboard_press
    key: Tab
  assert_steps:
  - action: assert_element
    selector:
      name: 多数字员工并行工作站.pdf
      role: page tab
  - action: assert_element
    selector:
      name: DTitlebarIconLabel
      role: button
  - action: assert_element
    selector:
      name: DTitlebarDWindowMinButton
      role: button
  - action: assert_element
    selector:
      name: 多数字员工并行工作站.pdf
      role: page tab list
  - action: assert_element
    selector:
      name: Button_thumbnail
      role: check box
  - action: assert_element
    selector:
      name: Form_SheetSidebar
      role: form
- id: suite_交互_键盘_004_s1
  name: 百分比输入框下拉菜单键盘操作
  description: ''
  annotation:
    测试界面: 标题栏-缩放百分比输入框（DLineEditChildLineEdit）
    测试功能: 选中百分比输入框下拉按钮按回车/空格弹出下拉菜单；上下方向键切换选中项；回车执行选择；Esc 退出菜单返回输入框选中
    前置条件: 已打开 PDF 文档
    AT元素引用:
    - DLineEditChildLineEdit
    - Form_DocSheet
  steps:
  - action: element_action
    selector:
      name: DLineEditChildLineEdit
      role: text
    do: click
  - action: keyboard_press
    key: Return
  - action: keyboard_press
    key: Down
  - action: keyboard_press
    key: Up
  - action: keyboard_press
    key: Down
  - action: keyboard_press
    key: Return
  - action: keyboard_press
    key: Escape
  assert_steps:
  - action: assert_element
    selector:
      name: DLineEditChildLineEdit
      role: text
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
- id: suite_交互_键盘_005_s1
  name: 主菜单下拉界面键盘导航
  description: ''
  annotation:
    测试界面: 主窗口-标题栏主菜单按钮（DTitlebarIconLabel）+主菜单（DTitlebarMainMenu）
    测试功能: Tab 选中主菜单按回车/空格弹出下拉菜单；上下方向键切换选中项；左右方向键展开/收起子菜单；回车执行选择；Esc 退出菜单返回主菜单按钮
    前置条件: 已打开 PDF 文档
    AT元素引用:
    - DTitlebarIconLabel
    - Form_DMainWindow
  steps:
  - action: element_action
    selector:
      name: DTitlebarIconLabel
      role: button
    do: click
  - action: keyboard_press
    key: Return
  - action: keyboard_press
    key: Down
  - action: keyboard_press
    key: Up
  - action: keyboard_press
    key: Right
  - action: keyboard_press
    key: Left
  - action: keyboard_press
    key: Return
  - action: keyboard_press
    key: Escape
  assert_steps:
  - action: assert_element
    selector:
      name: DTitlebarIconLabel
      role: button
  - action: assert_element
    selector:
      name: Form_DMainWindow
      role: form
- id: suite_交互_键盘_006_s1
  name: 右击主视图弹出右键菜单键盘导航
  description: ''
  annotation:
    测试界面: 文档内容区（Form_DocSheet）
    测试功能: 右击主视图弹出右键菜单；上下方向键切换选中菜单；左右方向键展开/收起子菜单；回车执行选择；Esc 退出菜单
    前置条件: 已打开 PDF 文档
    AT元素引用:
    - Form_DocSheet
    - Form_DMainWindow
