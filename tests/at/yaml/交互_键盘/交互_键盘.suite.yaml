  - action: keyboard_press
    key: Up
  - action: keyboard_press
    key: Right
  - action: keyboard_press
    key: Left
  - action: keyboard_press
    key: Return
  - action: keyboard_press
    key: Escape
  assert_steps:
  - action: assert_element
