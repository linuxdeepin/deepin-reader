      name: DLineEditChildLineEdit
      role: text
- id: suite_交互_键盘_009_s1
  name: 百分比框和页码框输入数值按Enter跳转
  description: ''
  annotation:
    测试界面: 标题栏-缩放百分比输入框（DLineEditChildLineEdit）+缩略图目录页码框（pageEdit）
    测试功能: 百分比框输入数值按回车页面跳转且焦点仍在百分比框；页码框输入数值按回车页面跳转且焦点仍在页码框
    前置条件: 已打开 PDF 文档并展开左侧栏（页码框在缩略图目录）
    AT元素引用:
    - Button_ThumbnailToggle
    - DLineEditChildLineEdit
    - pageEdit
    - Form_DocSheet
  steps:
  - action: element_action
    selector:
      name: Button_ThumbnailToggle
      role: check box
    do: click
  - action: element_action
    selector:
      name: DLineEditChildLineEdit
      role: text
    do: click
  - action: keyboard_hot_key
    key: ctrl+a
  - action: keyboard_type
    text: '50'
  - action: keyboard_press
    key: Return
  - action: element_action
    selector:
      name: pageEdit
      role: text
    do: click
  - action: keyboard_hot_key
    key: ctrl+a
  - action: keyboard_type
    text: '3'
  - action: keyboard_press
    key: Return
  assert_steps:
  - action: assert_element
    selector:
      name: DLineEditChildLineEdit
      role: text
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
  - action: assert_element
    selector:
      name: pageEdit
      role: text
