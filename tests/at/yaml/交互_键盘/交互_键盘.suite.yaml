name: 交互_键盘_suite
app: deepin-reader
module: 交互_键盘
setup:
- action: session_start
  command: deepin-reader
  wait: 3.0
suites:
- id: suite_交互_键盘_001_s1
  name: 首页Tab键切换
  description: ''
  steps:
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Enter
  - action: keyboard_press
    key: Escape
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Space
  - action: keyboard_press
    key: Down
  - action: keyboard_press
    key: Up
  - action: keyboard_press
    key: Enter
  - action: keyboard_press
    key: Escape
  assert_steps:
  - action: assert_element
    selector:
      name: Button_SelectFile
      role: push button
  - action: assert_element
    selector:
      name: DTitlebarMainMenu
      role: popup menu
  - action: assert_element
    selector:
      name: DTitlebarDWindowOptionButton
      role: push button
- id: suite_交互_键盘_002_s1
  name: 未展开侧栏Tab键切换
  description: ''
  steps:
  - action: keyboard_hot_key
    key: ctrl+o
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/normal.pdf
    wait: 3.0
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Tab
  - action: keyboard_press
    key: Enter
  assert_steps:
  - action: assert_element
    selector:
      name: Button_ThumbnailToggle
      role: check box
  - action: assert_element
    selector:
      name: PagingWidget
      role: panel
- id: suite_交互_键盘_003_s1
