name: 交互_触摸板_suite
app: deepin-reader
module: 交互_触摸板
setup:
- action: session_start
  command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
  wait: 3.0
suites:
- id: suite_交互_触摸板_001_s1
  name: 单指单击工具栏菜单按钮
  description: ''
  annotation:
    测试界面: 标题栏右区域 (Form_DTitlebarButtonArea) / 主菜单 (DTitlebarMainMenu)
    测试功能: 单指单击工具栏主菜单按钮打开主菜单并正常响应
    前置条件: 启动 deepin-reader 并已打开文档
    AT元素引用:
    - DTitlebarDWindowOptionButton
    - DTitlebarMainMenu
  steps:
  - action: mouse_click
    selector:
      name: DTitlebarDWindowOptionButton
      role: button
  assert_steps:
  - action: assert_element
    selector:
      name: DTitlebarDWindowOptionButton
      role: button
- id: suite_交互_触摸板_002_s1
  name: 单指单击任意缩略图
  description: ''
  annotation:
    测试界面: 左侧栏切换按钮组 (Form_SheetSidebar) / 缩略图面板 (Form_ThumbnailWidget)
    测试功能: 展开左侧栏切换书签、目录、缩略图、注释功能，单击任意缩略图正常切换
    前置条件: 启动 deepin-reader 并已打开多页文档
    AT元素引用:
    - Button_thumbnail
    - Button_catalog
    - Button_bookmark
    - Button_annotation
    - View_ImageList
  steps:
  - action: element_action
    selector:
      name: Button_thumbnail
      role: check box
    do: click
  - action: element_action
    selector:
      name: Button_catalog
      role: check box
    do: click
  - action: element_action
    selector:
      name: Button_bookmark
      role: check box
    do: click
  - action: element_action
    selector:
      name: Button_annotation
      role: check box
    do: click
  - action: element_action
    selector:
      name: Button_thumbnail
      role: check box
    do: click
  - action: element_action
    selector:
      name: View_ImageList
      role: list
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: View_ImageList
      role: list
- id: suite_交互_触摸板_003_s1
  name: 单指单击视图方式
  description: ''
  annotation:
    测试界面: 标题栏缩放控件 (Form_scaleEdit_P)
    测试功能: 单击放大缩小下拉框选中视图方式并正常切换
    前置条件: 启动 deepin-reader 并已打开文档
    AT元素引用:
    - DLineEditChildLineEdit
  steps:
  - action: element_action
    selector:
      name: DLineEditChildLineEdit
      role: text
    do: click
  - action: element_action
    selector:
      name: DLineEditChildLineEdit
      role: text
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: DLineEditChildLineEdit
      role: text
- id: suite_交互_触摸板_004_s1
  name: 单指单击增加、切换标签页
  description: ''
  annotation:
    测试界面: 文档标签页栏 (Form_DocTabBar) / 初始导航页 (Form_CentralNavPage)
    测试功能: 单击+按钮增加标签页并进入文件管理选择界面，单击标签页正常切换显示
    前置条件: 启动 deepin-reader 并已打开文档
    AT元素引用:
    - DTabBarAddButton
    - Button_SelectFile
    - page tab
  steps:
  - action: mouse_click
    selector:
      name: DTabBarAddButton
      role: button
  - action: mouse_click
    selector:
      name: DTabBarAddButton
      role: button
  - action: element_action
    selector:
      name: 多数字员工并行工作站.pdf
      role: page tab
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: Button_SelectFile
      role: button
  - action: assert_element
    selector:
      name: 多数字员工并行工作站.pdf
      role: page tab
- id: suite_交互_触摸板_005_s1
  name: 单指双击
  description: ''
  annotation:
    测试界面: 文档阅读区 (Form_CentralDocPage) / 标题栏最大化按钮 (DTitlebarDWindowMaxButton)
    测试功能: 单指双击工具栏/文档区实现窗口最大化与还原
    前置条件: 启动 deepin-reader 并已打开文档
    AT元素引用:
    - DTitlebarDWindowMaxButton
    - Form_CentralDocPage
  steps:
  - action: mouse_click
    selector:
      name: pageEdit
      role: text
  - action: mouse_click
    selector:
      name: pageEdit
      role: text
  assert_steps:
  - action: assert_element
    selector:
      name: DTitlebarDWindowMaxButton
      role: button
  - action: assert_element
    selector:
      name: DTitlebarDWindowMaxButton
      role: button
teardown:
- action: session_stop
