      name: Button_SelectFile
      role: button
- id: suite_标签页_009_s1
  name: 单窗口多标签页搜索管理
  description: ''
  annotation:
    测试界面: 文档阅读区 / 左侧搜索面板 / 文档标签页栏
    测试功能: 在不同标签页中搜索，搜索结果按标签页独立显示与关闭
    前置条件: 已打开多份文档形成多个标签页
    AT元素引用:
    - 多数字员工并行工作站.pdf
    - View_ImageList
    - Button_search
  steps:
  - action: element_action
    selector:
      name: Button_search
      role: check box
    do: click
  - action: keyboard_type
    text: test
  - action: element_action
    selector:
      name: 多数字员工并行工作站.pdf
      role: page tab
    do: click
  - action: element_action
    selector:
      name: Button_search
      role: check box
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: View_ImageList
      role: list
  - action: assert_element
    selector:
      name: View_ImageList
      role: list
