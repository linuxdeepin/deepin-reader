  description: ''
  annotation:
    测试界面: 文档阅读区 / 文档标签页栏 / 主菜单
    测试功能: 相同文档无法在窗口间重复添加，重复添加时激活当前页无提示
    前置条件: 已打开多份文档形成多个标签页
