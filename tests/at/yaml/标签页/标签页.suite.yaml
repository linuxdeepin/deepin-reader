    items:
    - 新窗口
  - action: mouse_drag
    selector:
      name: 多数字员工并行工作站.pdf
      role: page tab
  - action: mouse_drag
    selector:
      name: 多数字员工并行工作站.pdf
      role: page tab
  assert_steps:
  - action: assert_element
    selector:
      name: 多数字员工并行工作站.pdf
      role: page tab
  - action: assert_element
    selector:
