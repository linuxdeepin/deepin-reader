name: 文档视图_右键菜单_suite
app: deepin-reader
module: 文档视图_右键菜单
setup:
- action: session_start
  command: deepin-reader
  wait: 3.0
suites:
- id: suite_文档视图_右键菜单_001_s1
  name: 未选中文本右击-页面导航与书签注释菜单
  description: ''
  annotation:
    测试界面: 文档区 Form_DocSheet 右键菜单（BrowserMenu）
    测试功能: 未选中文本右击弹出菜单，逐一选择第一页/前一页/后一页/最后一页实现页面跳转，添加书签/添加注释菜单可正常触发
    前置条件: 已打开 PDF 文档（上下页面均有一部分显示在窗口内）
    AT元素引用:
    - Form_DocSheet
    - BrowserMenu
    - Button_SelectFile
  steps:
  - action: element_action
    selector:
      name: Button_SelectFile
      role: button
    do: click
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/normal.pdf
    wait: 3.0
  - action: mouse_right_click
    selector:
      name: Form_DocSheet
      role: form
  - action: dtk_context_menu
    items:
    - 第一页
    selector:
      name: Form_DocSheet
  - action: mouse_right_click
    selector:
      name: Form_DocSheet
      role: form
  - action: dtk_context_menu
    items:
    - 前一页
    selector:
      name: Form_DocSheet
  - action: mouse_right_click
    selector:
      name: Form_DocSheet
      role: form
  - action: dtk_context_menu
    items:
    - 后一页
    selector:
      name: Form_DocSheet
  - action: mouse_right_click
    selector:
      name: Form_DocSheet
      role: form
  - action: dtk_context_menu
    items:
    - 最后一页
    selector:
      name: Form_DocSheet
  - action: mouse_right_click
    selector:
      name: Form_DocSheet
      role: form
  - action: dtk_context_menu
    items:
    - 添加书签
    selector:
      name: Form_DocSheet
  - action: mouse_right_click
    selector:
      name: Form_DocSheet
      role: form
  - action: dtk_context_menu
    items:
    - 添加注释
    selector:
      name: Form_DocSheet
  assert_steps:
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
- id: suite_文档视图_右键菜单_002_s1
  name: 未选中文本右击-菜单功能（搜索/全屏/旋转）
  description: ''
  annotation:
    测试界面: 文档区 Form_DocSheet 右键菜单（BrowserMenu）
    测试功能: 打开 PDF 未选中文本右击弹出右键菜单，验证菜单由鼠标操作打开；逐项触发搜索、全屏/退出全屏、左旋转/右旋转等已具 AT 元素的功能
    前置条件: 已打开 PDF 文档
    AT元素引用:
    - Form_DocSheet
    - BrowserMenu
    - Form_SearchResWidget
    - DTitlebarDWindowQuitFullscreenButton
    - Form_DMainWindow
  steps:
  - action: element_action
    selector:
      name: Button_SelectFile
      role: button
    do: click
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/normal.pdf
    wait: 3.0
  - action: mouse_right_click
    selector:
      name: Form_DocSheet
      role: form
  - action: dtk_context_menu
    items:
    - 搜索
    selector:
      name: Form_DocSheet
  - action: keyboard_type
    text: user
  - action: keyboard_press
    key: Return
  - action: keyboard_press
    key: Escape
  - action: mouse_right_click
    selector:
      name: Form_DocSheet
      role: form
  - action: dtk_context_menu
    items:
    - 全屏
    selector:
      name: Form_DocSheet
  - action: mouse_right_click
    selector:
      name: Form_DocSheet
      role: form
  - action: dtk_context_menu
    items:
    - 退出全屏
    selector:
      name: Form_DocSheet
  - action: mouse_right_click
    selector:
      name: Form_DocSheet
      role: form
  - action: dtk_context_menu
    items:
    - 左旋转
    selector:
      name: Form_DocSheet
  - action: mouse_right_click
    selector:
      name: Form_DocSheet
      role: form
  - action: dtk_context_menu
    items:
    - 右旋转
    selector:
      name: Form_DocSheet
  assert_steps:
  - action: assert_element
    selector:
      name: Form_DocSheet
      role: form
  - action: assert_element
    selector:
      name: Form_SearchResWidget
      role: form
  - action: assert_element
    selector:
      name: DTitlebarDWindowQuitFullscreenButton
