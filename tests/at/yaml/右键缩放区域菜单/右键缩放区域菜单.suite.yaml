name: 右键缩放区域菜单_suite
app: deepin-reader
description: ''
module: 右键缩放区域菜单
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: pkill -9 -x deepin-reader || true; sleep 1; rm -rf ~/.local/share/deepin/deepin-reader ~/.config/deepin/deepin-reader ~/.cache/deepin/deepin-reader; deepin-reader ${TEST_FILES_DIR}/normal.pdf
  wait: 3.0
suites:
- id: suite_context_menu_scale_s1
  name: 右键缩放区域菜单 — 所有菜单项
  description: ''
  tags: []
  steps:
  - action: mouse_click
    selector:
      name: Form_CentralDocPage
  - action: dtk_context_menu
    selector:
      name: Form_LineEdit
      child_index: 1
      popup: click
    items:
    - 双页显示
  - action: dtk_context_menu
    selector:
      name: Form_LineEdit
      child_index: 1
      popup: click
    items:
    - 默认大小
  - action: dtk_context_menu
    selector:
      name: Form_LineEdit
      child_index: 1
      popup: click
    items:
    - 适合页面
  - action: dtk_context_menu
    selector:
      name: Form_LineEdit
      child_index: 1
      popup: click
    items:
    - 适应高度
  - action: dtk_context_menu
    selector:
      name: Form_LineEdit
      child_index: 1
      popup: click
    items:
    - 适应宽度
  assert_steps:
  - action: assert_element
    ref: n6
    selector:
      name: Form_CentralDocPage
      role: form
teardown:
- action: session_stop
