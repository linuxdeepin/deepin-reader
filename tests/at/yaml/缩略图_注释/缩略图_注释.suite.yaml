- id: suite_缩略图_注释_002_s1
  name: 图标注释的编辑、快捷键与取消
  description: ''
  annotation:
    测试界面: 文档阅读区 / 注释编辑窗口
    测试功能: 单击注释图标弹出编辑框并修改内容，编辑窗口内快捷键可用，不输入内容时点击他处自动取消
    前置条件: 启动 deepin-reader 并打开文档，已存在图标注释
    AT元素引用:
    - TextEditShadowWidget
    - TransparentTextEdit
    - Button_annotation
    - View_ImageList
  steps:
  - action: element_action
    selector:
      name: Button_annotation
      role: check box
    do: click
  - action: element_action
    selector:
      name: View_ImageList
      role: list
    do: click
  - action: element_action
    selector:
      name: TransparentTextEdit
      role: text
    do: click
  - action: keyboard_type
    text: 编辑后的图标注释内容
  - action: element_action
    selector:
      name: pageEdit
      role: text
    do: click
  - action: element_action
    selector:
      name: View_ImageList
      role: list
    do: click
  - action: element_action
    selector:
      name: TextEditShadowWidget
      role: text
    do: click
  - action: keyboard_press
    key: ctrl+a
  - action: keyboard_press
    key: ctrl+c
  - action: keyboard_press
    key: ctrl+v
  - action: keyboard_press
    key: ctrl+x
  - action: keyboard_press
    key: ctrl+z
  - action: keyboard_press
    key: ctrl+s
  - action: keyboard_press
    key: delete
  - action: element_action
    selector:
      name: Button_NotesAdd
      role: button
    do: click
  - action: element_action
    selector:
      name: pageEdit
      role: text
    do: click
  - action: element_action
    selector:
      name: pageEdit
      role: text
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: TransparentTextEdit
      role: text
    do: assert_not_exists
  - action: assert_element
    selector:
      name: View_ImageList
      role: list
    do: assert_exists
  - action: assert_element
    selector:
      name: TextEditShadowWidget
      role: text
    do: assert_not_exists
