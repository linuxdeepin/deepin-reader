name: 右键侧栏书签菜单_suite
app: deepin-reader
description: ''
module: 右键侧栏书签菜单
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: pkill -9 -x deepin-reader || true; sleep 1; rm -rf ~/.local/share/deepin/deepin-reader ~/.config/deepin/deepin-reader ~/.cache/deepin/deepin-reader; deepin-reader ${TEST_FILES_DIR}/normal.pdf
  wait: 3.0
suites:
- id: suite_context_menu_bookmark_s1
  name: 右键侧栏书签菜单 — 所有菜单项
  description: ''
  tags: []
  steps:
  - action: mouse_click
    ref: n224
    selector:
      name: Button_ThumbnailToggle
  - action: dtk_context_menu
    selector:
      name: Form_CentralDocPage
    items:
    - 添加书签
    wait: 5.0
  - action: mouse_click
    selector:
      name: Button_bookmark
  - action: mouse_click
    selector:
      name: View_ImageList
      child_index: 0
  - action: dtk_context_menu
    selector:
      name: View_ImageList
      child_index: 0
    items:
    - 删除书签
  - action: dtk_context_menu
    selector:
      name: Form_CentralDocPage
    items:
    - 添加书签
    wait: 5.0
  - action: mouse_click
    selector:
      name: Button_bookmark
  - action: mouse_click
    selector:
      name: View_ImageList
      child_index: 0
  - action: dtk_context_menu
    selector:
      name: View_ImageList
      child_index: 0
    items:
    - 全部删除
  assert_steps:
  - action: assert_element
    selector:
      name: Form_CentralDocPage
      role: form
teardown:
- action: session_stop
